<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/eval/static/css/main.css">
</head>
<body>
    <div class="dashboard">
        {{template "sidebar" .}}

        <div class="dashboard-main">
            {{template "header" .}}

            <main class="dashboard-content bg-body-tertiary">
                <!-- Page Title -->
                <div class="page-title">
                    <h1><i class="bi bi-journal-text text-primary"></i> Data KRS</h1>
                    <p class="text-body-secondary mb-0">Kartu Rencana Studi mahasiswa</p>
                </div>

                <!-- NPM Input -->
                <div class="card card-interactive border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-2 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label text-body-secondary"><i class="bi bi-person"></i> NPM</label>
                                <input type="text" class="form-control form-control-sm" id="npmInput" placeholder="Masukkan NPM...">
                            </div>
                            <div class="col-auto">
                                <button class="btn btn-primary btn-sm" id="loadKRSBtn"><i class="bi bi-search"></i> Tampilkan</button>
                                <a href="/eval/student" class="btn btn-outline-secondary btn-sm"><i class="bi bi-people"></i> Daftar Mahasiswa</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- KRS Data Container -->
                <div id="krsDataContainer">
                    <div class="text-center py-5">
                        <i class="bi bi-arrow-up display-4 text-body-secondary"></i>
                        <p class="lead text-body-secondary mt-3">Masukkan NPM untuk menampilkan data KRS.</p>
                        <p class="text-body-tertiary">Gunakan <a href="/eval/student">Daftar Mahasiswa</a> untuk mencari NPM.</p>
                    </div>
                </div>

                <script type="module" src="/eval/static/js/krs.js"></script>
            </main>
        </div>
    </div>

    <!-- Mobile sidebar backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    {{template "scripts" .}}
</body>
</html>
