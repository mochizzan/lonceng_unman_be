<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluasi - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/eval/static/css/main.css">
</head>
<body class="bg-body-tertiary">
  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm mt-5">
          <div class="card-body p-4">
            <h4 class="text-center mb-4"><i class="bi bi-shield-lock text-primary"></i> Evaluasi Login</h4>
            {{if .Error}}
            <div class="alert alert-danger" role="alert"><i class="bi bi-exclamation-triangle-fill"></i> {{.Error}}</div>
            {{end}}
            <form method="POST" action="/eval/login">
              <div class="mb-3">
                <label for="key" class="form-label">Access Key</label>
                <input type="password" class="form-control" id="key" name="key" required autofocus autocomplete="off">
              </div>
              <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
