<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Tidak Ditemukan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/eval/static/css/main.css">
</head>
<body>
    <div class="dashboard">
        {{template "sidebar" .}}

        <div class="dashboard-main">
            {{template "header" .}}

            <main class="dashboard-content bg-body-tertiary d-flex align-items-center justify-content-center">
                <div class="text-center py-5">
                    <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
                    <h1 class="display-6 fw-bold mt-3">404 - Tidak Ditemukan</h1>
                    <p class="text-body-secondary">NPM atau dokumen yang diminta tidak ditemukan.</p>
                    <a href="/eval" class="btn btn-primary mt-2"><i class="bi bi-arrow-left"></i> Kembali ke Dashboard</a>
                </div>
            </main>
        </div>
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    {{template "scripts" .}}
</body>
</html>
