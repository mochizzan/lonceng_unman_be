# =============================================================================
# Lonceng Unman Backend — Docker Compose (Production)
# Deployment: Docker on WSL2 (Windows host)
# Tunneling: cloudflared runs on Windows host, connects to localhost:3000
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Main Application Service
  # ---------------------------------------------------------------------------
  lonceng-api:
    # --- Pull from GitHub Container Registry (production) ---
    image: ghcr.io/mochizzan/lonceng_unman_be:latest

    # --- Build locally (development) ---
    # Uncomment below and comment out "image:" above to build from source
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     APP_NAME: lonceng_unman_be
    #     BUILD_TIME: ${BUILD_TIME:-}
    #     VERSION: ${VERSION:-latest}

    container_name: lonceng-api
    hostname: lonceng-api
    restart: unless-stopped

    # --- Environment File ---
    # Seluruh isi .env diteruskan ke container.
    # Docker Compose juga otomatis membaca .env untuk substitusi ${VAR} di file ini.
    env_file:
      - .env

    # --- Platform (explicit target architecture) ---
    platform: linux/amd64

    ports:
      # Bind to 127.0.0.1 only — cloudflared on Windows host connects via localhost
      # This prevents the app from being directly accessible on the LAN
      - "127.0.0.1:${APP_PORT:-3000}:3000"

    # --- Environment Overrides ---
    # Hanya nilai yang spesifik untuk container (override .env).
    # Semua variabel lain (SECRET_KEY, APP_ENV, CORS_*, LMS_*, BROWSER_*,
    # SESSION_*, PHOTO_*, MAX_*, TZ, AUTO_LOGIN, dll) dibawa oleh env_file.
    environment:
      APP_PORT: "3000"
      APP_HOST: "0.0.0.0"
      # Container-specific paths (berbeda dari .env development)
      DOWNLOAD_DIR: /data/downloads
      EXTRACT_DIR: /data/extracted
      EVAL_DIR: /data/eval/ground_truth
      # Pure ephemeral: no PROFILE_BASE_DIR bind-mount (in-memory TTL 15m)
      PROFILE_BASE_DIR: ""
      # Dev override for fast repro: SESSION_TTL=1m docker compose up -d (F account-switch 70s vs 10m)
      SESSION_TTL: "${SESSION_TTL:-15m}"

    # --- DNS Configuration ---
    # Use reliable public DNS for LMS domain resolution
    dns:
      - 8.8.8.8
      - 1.1.1.1

    # --- Volumes (bind mount — relative to this compose.yml) ---
    # Files will be accessible directly in the project folder
    # Works on any OS (Windows, Linux, Mac) — path is always relative
    volumes:
      - ./downloads:/data/downloads
      - ./extracted:/data/extracted
      - ./eval/ground_truth:/data/eval/ground_truth
      # Pure ephemeral: no ./profiles:/data/profiles bind-mount (TTL 15m in-memory)
      # Tmpfs for /tmp — RAM-based, faster than disk, auto-cleaned on container stop
      # Used by go-rod leakless binary and Chromium temp files
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 512M

    # --- Resource Limits ---
    # Chromium is memory-hungry; ensure enough headroom
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

    # --- Shared Memory for Chromium ---
    # Chromium uses /dev/shm for IPC. Default 64MB is too small and causes crashes.
    # 1GB is safe for headless Chromium with multiple tabs.
    shm_size: "1gb"

    # --- OOM Priority ---
    # Higher value = more likely to be killed by OOM killer
    # Chromium gets higher priority (more memory-hungry, less critical)
    oom_score_adj: 100

    # --- Kernel Parameters ---
    # Network tuning for better connection handling
    sysctls:
      # Max listen backlog for incoming connections
      net.core.somaxconn: 1024
      # Max SYN backlog for half-open connections
      net.ipv4.tcp_max_syn_backlog: 1024
      # Enable TCP Fast Open (client + server)
      net.ipv4.tcp_fastopen: 3

    # --- Graceful Shutdown ---
    # Allow 30s for in-flight requests and Chrome cleanup before SIGKILL
    stop_grace_period: 30s

    # --- Stop Signal ---
    # Explicit SIGTERM for graceful shutdown (default, but explicit is better)
    stop_signal: SIGTERM

    # --- Init Process ---
    # Docker's built-in init handles PID 1, signal forwarding, zombie reaping
    # Alternative to dumb-init in Dockerfile — more integrated with Docker
    init: true

    # --- Health Check ---
    # Uses wget (available in slim image), not curl
    # start_period: 30s for cold start (Chromium initialization takes time)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # --- Logging ---
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # --- Network ---
    networks:
      - lonceng-network

    # --- Security Hardening ---
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN  # Required by Chromium sandbox in container
    security_opt:
      - no-new-privileges:true

# ---------------------------------------------------------------------------
# Network Configuration
# ---------------------------------------------------------------------------
networks:
  lonceng-network:
    driver: bridge
    name: lonceng-network